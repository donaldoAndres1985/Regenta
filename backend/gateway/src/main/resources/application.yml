# gateway
#
# Unico punto de entrada. Hace dos cosas y nada mas: valida el JWT y enruta.
# Ninguna regla de negocio vive aqui, y ninguna decision tomada aqui se da por
# buena rio abajo: cada servicio revalida el plan, el modulo y el negocio.
#
# Las rutas se declaran servicio por servicio a proposito. Nada de comodines:
# si manana aparece un servicio nuevo, tiene que aparecer tambien en esta lista.

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: servicio-usuarios
              uri: ${SERVICIO_USUARIOS_URI:http://localhost:8081}
              predicates:
                - Path=/api/usuarios/**
            - id: servicio-clientes
              uri: ${SERVICIO_CLIENTES_URI:http://localhost:8082}
              predicates:
                - Path=/api/clientes/**
            - id: servicio-inventario
              uri: ${SERVICIO_INVENTARIO_URI:http://localhost:8083}
              predicates:
                - Path=/api/inventario/**
            - id: servicio-ventas
              uri: ${SERVICIO_VENTAS_URI:http://localhost:8084}
              predicates:
                - Path=/api/ventas/**
            - id: servicio-compras
              uri: ${SERVICIO_COMPRAS_URI:http://localhost:8085}
              predicates:
                - Path=/api/compras/**
            - id: servicio-recursos
              uri: ${SERVICIO_RECURSOS_URI:http://localhost:8086}
              predicates:
                - Path=/api/recursos/**
            - id: servicio-reservas
              uri: ${SERVICIO_RESERVAS_URI:http://localhost:8087}
              predicates:
                - Path=/api/reservas/**
            - id: servicio-menu
              uri: ${SERVICIO_MENU_URI:http://localhost:8088}
              predicates:
                - Path=/api/menu/**
            - id: servicio-mesas
              uri: ${SERVICIO_MESAS_URI:http://localhost:8089}
              predicates:
                - Path=/api/mesas/**
            - id: servicio-comandas
              uri: ${SERVICIO_COMANDAS_URI:http://localhost:8090}
              predicates:
                - Path=/api/comandas/**
            - id: servicio-facturacion
              uri: ${SERVICIO_FACTURACION_URI:http://localhost:8091}
              predicates:
                - Path=/api/facturacion/**
            - id: servicio-caja
              uri: ${SERVICIO_CAJA_URI:http://localhost:8092}
              predicates:
                - Path=/api/caja/**
            - id: servicio-alertas
              uri: ${SERVICIO_ALERTAS_URI:http://localhost:8093}
              predicates:
                - Path=/api/alertas/**
            - id: servicio-reportes
              uri: ${SERVICIO_REPORTES_URI:http://localhost:8094}
              predicates:
                - Path=/api/reportes/**
            - id: servicio-auditoria
              uri: ${SERVICIO_AUDITORIA_URI:http://localhost:8095}
              predicates:
                - Path=/api/auditoria/**

regenta:
  seguridad:
    jwt:
      # Secreto compartido con el emisor (servicio-usuarios, HU-013). Sin el,
      # el gateway no arranca: preferimos fallar al arrancar que aceptar
      # cualquier token. Minimo 32 caracteres (HS256 exige 256 bits).
      secreto: ${JWT_SECRETO:}
      emisor: ${JWT_EMISOR:regenta}
    # Lo unico que se atiende sin token. El login, por razones obvias: es
    # donde se consigue el token. Todo lo demas exige uno.
    rutas-publicas:
      - /actuator/health/**
      - /actuator/info
      - /api/usuarios/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
