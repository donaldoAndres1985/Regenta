server:
  port: ${PORT:8080}

spring:
  application:
    name: regenta-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/regenta_monolito}
    username: ${DB_USER:regenta}
    password: ${DB_PASSWORD:regenta}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  # HU-122 · Correo saliente por SMTP. El servidor y sus credenciales llegan SOLO por entorno
  # (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD); sin
  # SPRING_MAIL_HOST el correo queda en memoria. Tiempos cortos: un proveedor caído no cuelga nada.
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

regenta:
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS:https://regenta.pages.dev,https://*.regenta.pages.dev,http://localhost:5000,http://localhost:*}
  seguridad:
    jwt:
      secreto: ${JWT_SECRETO:regenta-secreto-super-seguro-de-al-menos-32-bytes!}
      emisor: ${JWT_EMISOR:regenta}
  jwt:
    secreto: ${JWT_SECRETO:regenta-secreto-super-seguro-de-al-menos-32-bytes!}
    emisor: ${JWT_EMISOR:regenta}
  # HU-121 · Documentos y archivos (facturas, reportes) en un almacén de objetos S3. Sin
  # configurar, en memoria (desarrollo y pruebas). Las credenciales vienen solo del entorno.
  almacen:
    tipo: ${ALMACEN_TIPO:memoria}
    s3:
      endpoint: ${ALMACEN_S3_ENDPOINT:}
      region: ${ALMACEN_S3_REGION:auto}
      bucket: ${ALMACEN_S3_BUCKET:regenta-documentos}
      access-key: ${ALMACEN_S3_ACCESS_KEY:}
      secret-key: ${ALMACEN_S3_SECRET_KEY:}
      crear-bucket: ${ALMACEN_S3_CREAR_BUCKET:false}
  # HU-122 · La dirección desde la que sale el correo (la que el proveedor tiene verificada). El
  # nombre visible y a quién se responde salen de la configuración de cada negocio.
  correo:
    remitente: ${CORREO_REMITENTE:notificaciones@regenta.app}
  # HU-131 · Días que la bitácora vive en la tabla viva antes de archivarse, si el negocio no
  # configuró los suyos: la del plan.
  auditoria:
    retencion:
      basico: ${AUDITORIA_RETENCION_BASICO:365}
      profesional: ${AUDITORIA_RETENCION_PROFESIONAL:730}
      empresarial: ${AUDITORIA_RETENCION_EMPRESARIAL:1825}
  reportes:
    # Cuánto vive un archivo exportado en el almacén antes de borrarse solo.
    retencion-de-archivos: ${REPORTES_RETENCION_ARCHIVOS:30d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
