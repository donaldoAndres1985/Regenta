# Entorno local completo: una base por servicio, RabbitMQ con panel y los
# 16 modulos. Un solo comando:  docker compose up -d
#
# Las credenciales salen de .env (copiar de .env.example). Nada de secretos
# en este archivo. Para ajustes de maquina, usar docker-compose.override.yml,
# que esta en .gitignore.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      REGENTA_DB_PASSWORD: ${REGENTA_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - regenta_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - ./docker/postgres/init-databases.sql:/sql/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - regenta_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gateway:
    build:
      context: .
      args:
        MODULO: gateway
    image: regenta/gateway:dev
    environment:
      SERVER_PORT: 8080
      JWT_SECRETO: ${JWT_SECRETO}
      JWT_EMISOR: ${JWT_EMISOR:-regenta}
      SERVICIO_USUARIOS_URI: http://servicio-usuarios:8080
      SERVICIO_CLIENTES_URI: http://servicio-clientes:8080
      SERVICIO_INVENTARIO_URI: http://servicio-inventario:8080
      SERVICIO_VENTAS_URI: http://servicio-ventas:8080
      SERVICIO_COMPRAS_URI: http://servicio-compras:8080
      SERVICIO_RECURSOS_URI: http://servicio-recursos:8080
      SERVICIO_RESERVAS_URI: http://servicio-reservas:8080
      SERVICIO_MENU_URI: http://servicio-menu:8080
      SERVICIO_MESAS_URI: http://servicio-mesas:8080
      SERVICIO_COMANDAS_URI: http://servicio-comandas:8080
      SERVICIO_FACTURACION_URI: http://servicio-facturacion:8080
      SERVICIO_CAJA_URI: http://servicio-caja:8080
      SERVICIO_ALERTAS_URI: http://servicio-alertas:8080
      SERVICIO_REPORTES_URI: http://servicio-reportes:8080
      SERVICIO_AUDITORIA_URI: http://servicio-auditoria:8080
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  servicio-usuarios:
    build:
      context: .
      args:
        MODULO: servicio-usuarios
    image: regenta/servicio-usuarios:dev
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/regenta_usuarios
      DB_USER: reg_usuarios
      DB_PASSWORD: ${REGENTA_DB_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
      JWT_EMISOR: ${JWT_EMISOR:-regenta}
      REGENTA_OPERADOR_CLAVE: ${REGENTA_OPERADOR_CLAVE}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  servicio-clientes:
