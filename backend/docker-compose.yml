# Regenta en local: PostgreSQL, un S3 de mentira y el monolito, con la misma imagen que va a Railway.
#
#   cp .env.example .env      # y cambiar los valores
#   docker compose up --build
#
# Ningún secreto vive aquí: todos salen del .env, que no se versiona (HU-125 C4).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: regenta_monolito
      POSTGRES_USER: ${DB_USER:-regenta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d regenta_monolito"]
      interval: 5s
      timeout: 5s
      retries: 20

  # El almacén de documentos (HU-121): S3 local, no valida credenciales.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${ALMACEN_S3_BUCKET:-regenta-documentos}
    ports:
      - "9090:9090"

  regenta:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/regenta_monolito
      ALMACEN_S3_ENDPOINT: http://s3:9090
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

volumes:
  pgdata:
