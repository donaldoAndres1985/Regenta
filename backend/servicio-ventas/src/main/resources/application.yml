# servicio-ventas
# La base es SOLO de este servicio. Nunca apuntar a la de otro.
server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: servicio-ventas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/regenta_ventas}
    username: ${DB_USER:reg_ventas}
    password: ${DB_PASSWORD:cambiar_en_local}
    hikari:
      pool-name: ventas-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      # SIEMPRE validate. El esquema lo crea Flyway; Hibernate solo comprueba
      # que coincide. Con update o create, produccion y migraciones divergen.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ventas
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: ventas
    default-schema: ventas
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:regenta}
    password: ${RABBIT_PASSWORD:cambiar_en_local}

regenta:
  clientes:
    # HU-040: el cupo y la cartera se preguntan a servicio-clientes al confirmar
    # una venta a credito. Es una llamada sincrona a proposito: bloquea al
    # vendedor porque la respuesta decide si la venta se puede hacer.
    url: ${CLIENTES_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.flywaydb: INFO
