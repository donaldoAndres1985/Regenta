# servicio-reservas
# La base es SOLO de este servicio. Nunca apuntar a la de otro.
server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: servicio-reservas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/regenta_reservas}
    username: ${DB_USER:reg_reservas}
    password: ${DB_PASSWORD:cambiar_en_local}
    hikari:
      pool-name: reservas-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      # SIEMPRE validate. El esquema lo crea Flyway; Hibernate solo comprueba
      # que coincide. Con update o create, produccion y migraciones divergen.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: reservas
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: reservas
    default-schema: reservas
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:regenta}
    password: ${RABBIT_PASSWORD:cambiar_en_local}

regenta:
  clientes:
    # HU-118: el snapshot del huésped se pide a servicio-clientes al cerrar la
    # estancia. Sincrona a proposito, pero best-effort: si no responde, el
    # check-out sigue y la factura sale al adquiriente generico.
    url: ${CLIENTES_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.flywaydb: INFO
