# servicio-comandas
# La base es SOLO de este servicio. Nunca apuntar a la de otro.
server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: servicio-comandas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/regenta_comandas}
    username: ${DB_USER:reg_comandas}
    password: ${DB_PASSWORD:cambiar_en_local}
    hikari:
      pool-name: comandas-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      # SIEMPRE validate. El esquema lo crea Flyway; Hibernate solo comprueba
      # que coincide. Con update o create, produccion y migraciones divergen.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: comandas
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: comandas
    default-schema: comandas
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:regenta}
    password: ${RABBIT_PASSWORD:cambiar_en_local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.flywaydb: INFO
