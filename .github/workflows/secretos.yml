name: secretos

# HU-125 C4 · Ningún secreto versionado: ni llaves ni certificados ni .env, ni tokens con formato
# conocido en el texto. Corre en todo PR y en main, sin filtro de rutas: un secreto puede colarse en
# cualquier carpeta.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revisar:
    name: sin secretos en el repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/revisar-secretos.sh
