name: app

on:
  # HU-129: push y pull_request a la vez hacian correr todo dos veces por cada
  # cambio en una rama con PR abierto. El push queda solo para main —que no
  # tiene pull_request propio y si no, no se valida— y pull_request cubre el
  # resto de las ramas con una sola corrida.
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

# En un PR, un push nuevo cancela la corrida vieja; en main no, para no cortar un despliegue (HU-125).
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-test:
    name: analizar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: melos
        run: |
          dart pub global activate melos 6.3.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # `melos bootstrap` lanza un `flutter pub get` por paquete en paralelo, y
      # los 14 hacen carrera inicializando el SDK la primera vez. El que pierde
      # lee la version del engine vacia y pide
      # `flutter_infra_release/flutter//engine_stamp.json` -con la doble barra-,
      # que responde 404 y tumba el bootstrap entero. Con el SDK ya listo, no
      # hay nada que inicializar y la carrera no existe.
      - name: calentar el SDK
        run: flutter --version

      # Criterio 3 de HU-129: "bajando metadatos de Flutter" es exactamente lo
      # que tumbo el PR #215 con el codigo intacto. bootstrap es el paso que
      # de verdad baja dependencias (un `pub get` por paquete); se reintenta
      # solo, no el analyze/test de despues.
      - name: bootstrap
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd app && melos bootstrap

      # Criterio 3 de HU-002: ningun modulo depende de otro modulo.
      - name: dependencias entre modulos
        run: dart run tool/check_module_deps.dart

      # El codigo generado (Drift) esta versionado: aqui se comprueba que no
      # quedo desactualizado respecto al esquema.
      - name: codigo generado al dia
        run: |
          melos run generar --no-select
          git diff --exit-code -- '*.g.dart'

      - name: analyze
        run: |
          set -o pipefail
          melos run analyze --no-select 2>&1 | tee analyze.log

      - name: Publicar error de analyze
        if: failure()
        run: |
          echo "### Resultado de flutter analyze" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat analyze.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q " • " analyze.log; then
            grep -E " • " analyze.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            tail -n 25 analyze.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: test
        run: |
          set -o pipefail
          melos run test --no-select 2>&1 | tee test.log

      - name: Publicar error de test
        if: failure()
        run: |
          if [ -f test.log ]; then
            echo "### Fallos en pruebas" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -C 3 -E "(FAILED|Expected:|Actual:|══╡ EXCEPTION)" test.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      # HU-128 criterio 2: cuando un golden falla, la imagen esperada, la
      # obtenida y la diferencia quedan como artefacto de la corrida.
      - name: diferencias de goldens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-fallidos
          path: app/packages/*/test/goldens/failures/
          if-no-files-found: ignore

  build:
    name: compilar Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/apps/regenta
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: build web
        run: flutter build web --release

      # HU-123: la configuración de Firebase entra por --dart-define desde los secretos del repo; sin ellos
      # el APK sale igual, sin push. Nunca hay google-services.json en el repo.
      - name: build apk
        if: startsWith(github.ref, 'refs/tags/')
        uses: nick-fields/retry@v3
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            cd app/apps/regenta && flutter build apk --debug
            --dart-define=API_BASE_URL=${{ vars.API_URL || 'https://regenta-production.up.railway.app' }}
            --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY
            --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
            --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID

  # HU-125 C1 · La Web se despliega en Cloudflare Pages solo si el análisis y las pruebas pasaron.
  # Pages publica atómicamente: hasta que la versión nueva está completa sigue sirviendo la anterior (C3).
  # La URL del backend sale de la variable del repo API_URL; nada de esto es secreto salvo el token.
  desplegar-web:
    name: desplegar Web
    needs: [analyze-test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DESPLIEGUE_ACTIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: produccion-web
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: despliegue-web
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app/apps/regenta
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: build web
        run: |
          set -o pipefail
          flutter build web --release --dart-define=API_BASE_URL=${{ vars.API_URL }} 2>&1 | tee build.log

      - name: publicar error de build
        if: failure()
        run: |
          grep -i -C 2 -E "(error|exception|failed)" build.log | head -n 35 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/apps/regenta/build/web --project-name=${{ vars.CLOUDFLARE_PAGES_PROYECTO || 'regenta' }} --branch=main --commit-hash=${{ github.sha }}
