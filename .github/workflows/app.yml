name: app

on:
  # HU-129: push y pull_request a la vez hacian correr todo dos veces por cada
  # cambio en una rama con PR abierto. El push queda solo para main —que no
  # tiene pull_request propio y si no, no se valida— y pull_request cubre el
  # resto de las ramas con una sola corrida.
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analizar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true

      - name: melos
        run: |
          dart pub global activate melos 6.3.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # `melos bootstrap` lanza un `flutter pub get` por paquete en paralelo, y
      # los 14 hacen carrera inicializando el SDK la primera vez. El que pierde
      # lee la version del engine vacia y pide
      # `flutter_infra_release/flutter//engine_stamp.json` -con la doble barra-,
      # que responde 404 y tumba el bootstrap entero. Con el SDK ya listo, no
      # hay nada que inicializar y la carrera no existe.
      - name: calentar el SDK
        run: flutter --version

      # Criterio 3 de HU-129: "bajando metadatos de Flutter" es exactamente lo
      # que tumbo el PR #215 con el codigo intacto. bootstrap es el paso que
      # de verdad baja dependencias (un `pub get` por paquete); se reintenta
      # solo, no el analyze/test de despues.
      - name: bootstrap
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd app && melos bootstrap

      # Criterio 3 de HU-002: ningun modulo depende de otro modulo.
      - name: dependencias entre modulos
        run: dart run tool/check_module_deps.dart

      # El codigo generado (Drift) esta versionado: aqui se comprueba que no
      # quedo desactualizado respecto al esquema.
      - name: codigo generado al dia
        run: |
          melos run generar --no-select
          git diff --exit-code -- '*.g.dart'

      - name: analyze
        run: |
          set -o pipefail
          melos run analyze --no-select 2>&1 | tee analyze.log

      - name: Publicar error de analyze
        if: failure()
        run: |
          echo "### Resultado de flutter analyze" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat analyze.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q " • " analyze.log; then
            grep -E " • " analyze.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            tail -n 25 analyze.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: test
        run: |
          set -o pipefail
          melos run test --no-select 2>&1 | tee test.log

      - name: Publicar error de test
        if: failure()
        run: |
          if [ -f test.log ]; then
            echo "### Fallos en pruebas" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -C 3 -E "(FAILED|Expected:|Actual:|══╡ EXCEPTION)" test.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      # HU-128 criterio 2: cuando un golden falla, la imagen esperada, la
      # obtenida y la diferencia quedan como artefacto de la corrida.
      - name: diferencias de goldens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-fallidos
          path: app/packages/*/test/goldens/failures/
          if-no-files-found: ignore

  build:
    name: compilar Android y Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/apps/regenta
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: build web
        run: flutter build web --release

      - name: build apk
        run: flutter build apk --debug
