name: Deploy Flutter Web a Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: app/apps/regenta
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Si el proyecto usa code generation (Riverpod generator, Drift, freezed, json_serializable), ejecutar:
      # - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build web --release --dart-define=API_BASE_URL=https://regenta-production.up.railway.app

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/apps/regenta/build/web --project-name=regenta --branch=main
