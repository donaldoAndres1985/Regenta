name: Deploy Flutter Web a Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: app/apps/regenta
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Web
        run: |
          set -o pipefail
          flutter build web --release --dart-define=API_BASE_URL=https://regenta-production.up.railway.app 2>&1 | tee build.log

      - name: Publicar error como anotaciones
        if: failure()
        run: |
          tail -n 30 build.log | while IFS= read -r line; do
            echo "::error::$line"
          done

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/apps/regenta/build/web --project-name=regenta --branch=main
