name: regenta_compras
description: "Modulo compras de Regenta. Cuelga del nucleo, nunca de otro modulo."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  regenta_core:
    path: ../core
  flutter_riverpod: ^2.6.1
  mobile_scanner: ^5.2.3
  printing: ^5.15.1
  # HU-183: guardar los informes en PDF o Excel.
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # HU-182: la recepción sin señal se prueba contra la cola de verdad, en memoria.
  dio: ^5.7.0
  drift: ^2.20.0
