name: regenta

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Analisis estatico de todo el arbol. Cualquier aviso es un fallo.
    # Un solo `flutter analyze` en la raiz cubre los 13 paquetes con un unico
    # proceso: sin correr uno por paquete no hay pelea por el lock de arranque
    # de Flutter (que en el CI hacia fallar el paso de forma intermitente).
    run: flutter analyze --fatal-infos --fatal-warnings

  test:
    description: Pruebas de los paquetes que tienen carpeta test/.
    run: melos exec --concurrency=1 --dir-exists=test -- flutter test

  deps-check:
    description: Ningun paquete de modulo depende de otro paquete de modulo, solo de core.
    run: dart run tool/check_module_deps.dart

  generar:
    description: Codigo generado (Drift). Corre cuando cambia un esquema local.
    exec: dart run build_runner build --delete-conflicting-outputs
    packageFilters:
      dependsOn: build_runner

  verify:
    description: Lo que tiene que pasar antes de un push. Igual que el CI.
    steps:
      - deps-check
      - analyze
      - test
